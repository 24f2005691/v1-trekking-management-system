{% extends 'base.html' %}

{% block title %} Registration Page {% endblock title %}

{% block style %}

    <style>
        .login-btn{
            color: var(--primary) !important;
            background: transparent;
            border: 2px solid var(--primary);
            padding: 0.7rem 1.4rem;
            border-radius: 0.6rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .login-btn:hover{
            background: rgba(31, 95, 139, 0.08);
            transform: translateY(-2px);
        }
        .register-btn{
            background: var(--primary);
            border: none;
            color: white !important;
            padding: 0.7rem 1.4rem;
            border-radius: 0.6rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.25s ease;
        }
        .register-btn:hover{
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        .form-container{
            margin-top: 60px;
        }
        .form-content{
            box-shadow: 0 0 5px var(--text-secondary);
            width: 100%;
            width: 500px;
            padding: 3em;
            border-radius: 1rem;
            background: white;
        }
        .form-field{
            display: flex;
            flex-direction: column;
        }
        .center{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* login register pages */
        .login-register-heading{
            color: var(--primary);
            font-weight: 600;
            font-size: 2rem;
        }
        .accent{
            color: var(--accent);
        }
        .user-type-radio{
            display: flex;
            flex-direction: row;
            gap: 1rem;
            padding-top: 10px;
            padding-bottom: 10px;
        }
        .search-navactions{
            display: flex;
            flex-direction: row;
            gap: 1rem;
        }
</style>

{% endblock style %}

{% block body %}

<div class="form-container center">
<form action="{{url_for('auth.user_registration')}}" method="POST">
    <div class="form-content">
        <h1 class="center login-register-heading">User Registration</h1>
    
    <div class="form-field">
        <label class="form-label">Full Name</label>
        <input 
            type="text"
            name="name"
            class="form-control"
            required
        >
    </div>

    <div class="form-field">
        <label class="form-label">Email Address</label>
        <input
            type="email"
            name="email"
            class="form-control"
            required
        >
    </div>

    <div class="form-field">
        <label class="form-label">Phone Number</label>
        <input
            type="tel"
            name="phone"
            class="form-control"
            required
        >
    </div>

    <div class="form-field user-type-radio">
    <label class="form-label">Register As:</label>

    <div>
        <input
            type="radio"
            name="role"
            value="trekker"
            checked
        >
        <label>Trekker</label>
    </div>

    <div>
        <input
            type="radio"
            name="role"
            value="staff"
        >
        <label>Staff</label>
    </div>
    </div>

    <div class="form-field">
        <label class="form-label">Password</label>
        <input
            type="password"
            name="password"
            class="form-control"
            required
        >
    </div>

    <div class="form-field">
        <label class="form-label">Confirm Password</label>
        <input
            type="password"
            name="confirm_password"
            class="form-control"
            required
        >
    </div>

    <div class="center">
        <button
            type="submit"
            class="register-btn"
            style="margin-top: 15px;"
        >
            Register
        </button>
    </div>
    <span class="center" style="display: flex; flex-direction: row; gap: 0.5rem; margin-top: 1rem">Already have an account?<a href={{url_for('auth.user_login')}}>Login Here</a></span>
</div>
</form>
</div>
{% endblock body %}
